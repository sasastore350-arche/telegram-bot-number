<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>TG AFROTO</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg1:#040b1f;--bg2:#0a1f4d;--card:#0d1f45cc;--line:#1d3f86;--txt:#eaf2ff;--mut:#8fa8d6;--pri:#2f8bff;--pri2:#00c2ff;--ok:#2ee59d;--bad:#ff5d73;--warn:#ffc24b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:'Cairo',system-ui,sans-serif;color:var(--txt);background:radial-gradient(1200px 600px at 80% -10%,#124aa8 0%,transparent 60%),linear-gradient(180deg,var(--bg2),var(--bg1) 70%) fixed;padding:14px 14px 110px}
h2{margin:6px 0 14px;font-size:22px}h3{margin:0 0 10px}
.hint{color:var(--mut);font-size:14px;line-height:1.7}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;backdrop-filter:blur(6px)}
.hero{text-align:center;padding:6px 0 14px}.hero .logo{font-size:30px;font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,var(--pri2),#7db4ff);-webkit-background-clip:text;color:transparent}
.hero .sub{color:var(--mut);font-size:14px}
.prof{display:flex;gap:12px;align-items:center}
.ava{width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));display:grid;place-items:center;font-size:26px;font-weight:900;overflow:hidden;flex:none;border:2px solid #4aa3ff}
.ava img{width:100%;height:100%;object-fit:cover}
.prof b{font-size:18px;display:block}.prof small{color:var(--mut)}
.bal{font-size:40px;font-weight:900;background:linear-gradient(90deg,#fff,#8fd0ff);-webkit-background-clip:text;color:transparent}
.lbl{color:var(--mut);font-size:14px}
.row{display:flex;gap:10px}.row>*{flex:1}
.stat{display:flex;align-items:center;gap:12px}.stat .ic{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));display:grid;place-items:center;font-size:22px;flex:none}
.stat b{font-size:24px;display:block}
.btn{width:100%;border:0;border-radius:16px;padding:15px;font:700 17px Cairo;color:#fff;background:linear-gradient(90deg,var(--pri),var(--pri2));cursor:pointer;box-shadow:0 8px 24px #1a6dff55;margin-top:10px}
.btn.ghost{background:#ffffff14;box-shadow:none;border:1px solid var(--line)}.btn.red{background:linear-gradient(90deg,#d6283f,#ff5d73)}.btn:disabled{opacity:.5}
input{width:100%;background:#071536;border:1px solid var(--line);border-radius:16px;padding:14px;color:var(--txt);font:600 16px Cairo;margin:8px 0;outline:none}
input:focus{border-color:var(--pri2)}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.tab{flex:none;border:1px solid var(--line);background:#0b1d42;color:var(--txt);border-radius:999px;padding:10px 18px;font:700 15px Cairo;cursor:pointer}
.tab.on{background:linear-gradient(90deg,var(--pri),var(--pri2));border-color:transparent}
.item{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:10px;cursor:pointer}
.item.off{opacity:.45}.item .nm{font-weight:700;font-size:17px}.item small{color:var(--mut);display:block}
.price{color:#7fd0ff;font-weight:900;font-size:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px 12px;text-align:center;cursor:pointer}
.tile .e{font-size:42px}.tile b{display:block;margin-top:8px}.tile small{color:var(--mut)}
.nav{position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));background:#08183acc;backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:28px;display:flex;justify-content:space-around;padding:8px 4px;z-index:5}
.nav button{background:none;border:0;color:var(--mut);font:600 11px Cairo;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;cursor:pointer;border-radius:16px}
.nav button span{font-size:22px}.nav button.on{color:#fff;background:#2f8bff33}
.sheet{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end}
.sheet>div{background:linear-gradient(180deg,#0d2a63,#071a40);border-top:1px solid var(--line);width:100%;border-radius:28px 28px 0 0;padding:20px 18px 28px;max-height:88vh;overflow:auto}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed #1d3f86}.kv span{color:var(--mut)}
.qty{display:flex;align-items:center;justify-content:center;gap:18px;margin:10px 0}.qty button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:#0b1d42;color:#fff;font:900 24px Cairo}.qty b{font-size:26px;min-width:40px;text-align:center}
.switch{display:flex;gap:8px;margin:8px 0}.switch .tab{flex:1;text-align:center;border-radius:14px}
.copy{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#071536;border:1px dashed #3c7be0;border-radius:16px;padding:12px 14px;margin:8px 0}
.copy .v{font:900 20px Cairo;direction:ltr;word-break:break-all}.copy button{background:var(--pri);border:0;color:#fff;border-radius:12px;padding:8px 12px;font:700 14px Cairo}
.code{font:900 46px Cairo;letter-spacing:8px;text-align:center;color:#7fd0ff;direction:ltr}
.ok{text-align:center;padding:24px 8px}.ok .big{font-size:76px}
.spin{width:44px;height:44px;border:4px solid #ffffff22;border-top-color:var(--pri2);border-radius:50%;margin:14px auto;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#0d2a63;border:1px solid var(--pri);padding:10px 18px;border-radius:14px;z-index:50;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chips button{border:1px solid var(--line);background:#0b1d42;color:#fff;border-radius:12px;padding:9px 14px;font:700 14px Cairo}
.badge{font-size:12px;border-radius:999px;padding:3px 10px;background:#2f8bff33;color:#9fd0ff}.badge.ok{background:#2ee59d22;color:var(--ok)}
.warn{background:#ffc24b1a;border:1px solid #ffc24b55;color:var(--warn);border-radius:14px;padding:10px 12px;font-size:14px;margin-top:10px}
.empty{text-align:center;color:var(--mut);padding:36px 0}.empty .e{font-size:54px}
.back{background:none;border:0;color:#9fd0ff;font:700 15px Cairo;padding:4px 0 10px;cursor:pointer}
</style>
</head>
<body>
<div id="app"></div>
<nav class="nav" id="nav"></nav>
<script>
const tg = window.Telegram && window.Telegram.WebApp;
try{ tg.ready(); tg.expand(); tg.setHeaderColor('#0a1f4d'); tg.setBackgroundColor('#040b1f'); }catch(e){}
let S = null, TAB = 'home', timers = [];
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ERR = {
  auth:'تعذر التحقق من حسابك. افتح التطبيق من داخل البوت.', no_account:'ابدأ البوت الأول بإرسال /start.', banned:'حسابك محظور.',
  maintenance:'البوت تحت الصيانة حاليًا.', rate:'محاولات كتير، استنى شوية.', unavailable:'غير متاح حاليًا.',
  bad_amount:'القيمة غير صحيحة.', bad_sender:'رقم المحفظة غير صحيح (11 رقم).', bad_order:'معرف الطلب غير صحيح.',
  used:'معرف الطلب ده اتستخدم قبل كده.', notfound:'غير موجود. راجع البيانات وجرب تاني.', busy:'الرقم ده مستخدم في طلب شحن شغّال.',
  too_many:'عدد المحاولات خلص، حاول بعد ساعة.', timeout:'السيرفر اتأخر، جرب تاني.', server:'خطأ في السيرفر، جرب بعد شوية.',
  no_balance:'رصيدك لا يكفي. اشحن رصيدك الأول.', no_stock:'لا توجد حسابات متاحة.', buy_failed:'فشلت العملية.', wait:'استنى شوية.'
};
const errText = (r) => (r && (r.message || ERR[r.error])) || ERR.server;
function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2800); }
function hap(k){ try{ tg.HapticFeedback.notificationOccurred(k); }catch(e){} }
async function api(action, params={}){
  try{
    const r = await fetch('/api/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({init_data:(tg&&tg.initData)||'',params})});
    const j = await r.json();
    if (j.status==='done') return j.result;
    if (j.status==='pending'){
      for(let i=0;i<15;i++){ const jj = await (await fetch('/api/result/'+j.id)).json(); if (jj.status==='done') return jj.result; }
      return {ok:false,error:'timeout'};
    }
    return {ok:false,error:j.error||'server'};
  }catch(e){ return {ok:false,error:'server'}; }
}
async function copy(t){
  try{ await navigator.clipboard.writeText(t); }catch(e){ const a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select(); try{document.execCommand('copy')}catch(_){} a.remove(); }
  toast('تم النسخ ✅'); hap('success');
}
const usd = (n) => '$' + (Number(n)||0).toFixed(2);
const money = (n) => S && S.currency==='EGP' ? ((Number(n)||0)*S.rate).toFixed(2)+' ج.م' : usd(n);
const clearTimers = () => { timers.forEach(clearInterval); timers=[]; };
const when = (t) => { const d=new Date(t*1000); return d.toLocaleDateString('ar-EG')+' '+d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}); };
const back = (to='home') => `<button class="back" data-go="${to}">→ رجوع</button>`;
const loading = () => { $('#app').innerHTML = '<div class="ok"><div class="spin"></div></div>'; };
function openBot(){ try{ tg.openTelegramLink('https://t.me/'+S.bot); }catch(e){ location.href='https://t.me/'+S.bot; } }
function openLink(u){ if(!u) return toast('الرابط غير متاح'); try{ if(u.includes('t.me')) tg.openTelegramLink(u); else tg.openLink(u); }catch(e){ window.open(u,'_blank'); } }

const NAV = [['home','🏠','الرئيسية'],['num','✈️','حسابات'],['ses','💾','جلسات'],['pay','💳','شحن'],['gift','🎁','هدايا'],['orders','📋','طلباتي'],['set','⚙️','الإعدادات']];
function drawNav(){ $('#nav').innerHTML = NAV.map(n=>`<button data-tab="${n[0]}" class="${TAB===n[0]?'on':''}"><span>${n[1]}</span>${n[2]}</button>`).join(''); }
function go(v, arg){ clearTimers(); closeSheet(); const t = ({payhub:'pay',stars:'pay',binance:'pay',vodafone:'pay',track:'set'})[v] || v; TAB = NAV.some(n=>n[0]===t)?t:TAB; drawNav(); (VIEWS[v]||VIEWS.home)(arg); window.scrollTo(0,0); }
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-tab],[data-go]'); if (!t) return;
  if (t.dataset.tab) go(t.dataset.tab === 'pay' ? 'payhub' : t.dataset.tab); else go(t.dataset.go);
});
function sheet(html){ closeSheet(); const d=document.createElement('div'); d.className='sheet'; d.id='sheet'; d.innerHTML=`<div>${html}</div>`; d.onclick=(e)=>{ if(e.target===d) closeSheet(); }; document.body.appendChild(d); return d; }
function closeSheet(){ const d=$('#sheet'); if(d) d.remove(); }
async function refresh(){ const r = await api('init'); if (r.ok) S = r; return r; }

/* ---------------- الرئيسية ---------------- */
function home(){
  const rec = (S.recent||[]).map(o=>`<div class="item" style="cursor:default"><div><div class="nm">${esc(o.country)} ${o.kind==='ses'?'· '+(o.qty||1)+' جلسة':''}</div><small>${esc(o.cat||'')} ${o.phone?'· +'+esc(o.phone):''}</small></div><div><span class="price">${money(o.price*(o.kind==='ses'?(o.qty||1):1))}</span><small>${when(o.at)}</small></div></div>`).join('');
  $('#app').innerHTML = `
   <div class="hero"><div class="logo">TG AFROTO</div><div class="sub">عالم التميز في الخدمات الرقمية</div></div>
   <div class="card"><div class="prof"><div class="ava">${S.photo?`<img src="${esc(S.photo)}" alt="">`:esc((S.name||'?')[0])}</div>
     <div><small>${S.username?'@'+esc(S.username):'ID '+S.uid}</small><b>مرحباً ${esc(S.name)}</b></div></div></div>
   <div class="card"><div class="lbl">💰 رصيد المحفظة</div><div class="bal">${money(S.balance)}</div>
     <button class="btn" data-go="payhub">💳 شحن الرصيد</button></div>
   <div class="row"><div class="card stat"><div class="ic">📦</div><div><b>${S.orders_count}</b><span class="lbl">إجمالي الطلبات</span></div></div>
     <div class="card stat"><div class="ic">💎</div><div><b>${money(S.spent)}</b><span class="lbl">إجمالي الإنفاق</span></div></div></div>
   <div class="row"><button class="btn" data-go="num">✈️ شراء حسابات</button><button class="btn" data-go="ses">💾 شراء جلسات</button></div>
   <div class="card" style="margin-top:12px"><div class="lbl">📊 نشاطك هذا الأسبوع</div><div class="price" style="font-size:26px">${money(S.week)}</div></div>
   <h3>🕒 آخر نشاطاتك</h3>${rec || '<div class="empty"><div class="e">🦊</div>لسه ما عندك أي نشاط، ابدأ أول طلب!</div>'}`;
}

/* ---------------- شراء حسابات / جلسات ---------------- */
let BUY = {mode:'cat', cid:null, cats:[], list:[], q:''};
async function buyView(mode){
  BUY.mode = mode; loading();
  const r = await api('cats',{});
  if (!r.ok) return $('#app').innerHTML = `<div class="empty"><div class="e">⚠️</div>${esc(errText(r))}</div>`;
  BUY.cats = r.cats;
  if (mode==='cat' && !BUY.cats.find(c=>c.id===BUY.cid)) BUY.cid = (BUY.cats[0]||{}).id;
  await loadList();
}
async function loadList(){
  loading();
  if (BUY.mode==='ses'){ const r = await api('ses_list'); BUY.list = r.ok ? r.countries : []; }
  else if (BUY.cid){ const r = await api('countries',{cid:BUY.cid}); BUY.list = r.ok ? r.countries.map(c=>Object.assign({cid:BUY.cid},c)) : []; }
  else BUY.list = [];
  drawBuy();
}
function drawBuy(){
  const ses = BUY.mode==='ses';
  $('#app').innerHTML = `<h2>${ses?'جلسات جاهزة — اختر الدولة':'حسابات جاهزة — اختر الدولة'}</h2>
   <div class="tabs">${BUY.cats.map(c=>`<button class="tab ${!ses&&c.id===BUY.cid?'on':''}" data-cid="${esc(c.id)}">${esc(c.name)} <small>(${c.stock})</small></button>`).join('')}
     <button class="tab ${ses?'on':''}" data-cid="__ses">💾 جلسات</button></div>
   <input id="q" placeholder="🔍 بحث عن دولة..." value="${esc(BUY.q)}"><div id="clist"></div>`;
  document.querySelectorAll('[data-cid]').forEach(b=>b.onclick=()=>{
    if (b.dataset.cid==='__ses') BUY.mode='ses'; else { BUY.mode='cat'; BUY.cid=b.dataset.cid; }
    loadList();
  });
  $('#q').oninput = (e)=>{ BUY.q=e.target.value; drawList(); };
  drawList();
}
function drawList(){
  const q = BUY.q.trim().toLowerCase(), ses = BUY.mode==='ses';
  const l = BUY.list.filter(c=>!q || String(c.name).toLowerCase().includes(q) || String(c.code).includes(q));
  $('#clist').innerHTML = l.length ? l.map(c=>`<div class="item ${c.stock<=0?'off':''}" data-i="${BUY.list.indexOf(c)}">
     <span class="price">${money(c.price)}</span><div style="text-align:right"><div class="nm">${esc(c.flag)} ${esc(c.name)} (${esc(c.code)})</div>
     <small>${ses?esc(c.cat)+' · ':''}${c.stock>0?'متاح: '+c.stock:'نفدت الكمية'}</small></div></div>`).join('')
     : '<div class="empty"><div class="e">📭</div>لا توجد نتائج</div>';
  document.querySelectorAll('.item[data-i]').forEach(el=>el.onclick=()=>pick(BUY.list[+el.dataset.i]));
}
const backBtn = (fn) => `<button class="back" id="bk">→ رجوع</button>`;
function pick(c){
  if (c.stock<=0) return toast('نفدت الكمية');
  BUY.mode==='ses' ? confirmSes(c) : confirmNum(c);
}
function insufficient(required){
  $('#app').innerHTML = `${backBtn()}
   <div class="card ok"><div class="big">💳</div><h2 style="color:var(--bad)">رصيدك غير كافٍ</h2>
    <p class="hint">المطلوب: <b style="color:#7fd0ff">${money(required)}</b><br>متوفر: <b>${money(S.balance)}</b></p>
    <p class="hint">يرجى الشحن ثم العودة هنا.</p>
    <button class="btn" id="gp">💳 الذهاب للشحن</button></div>`;
  $('#bk').onclick = drawBuy; $('#gp').onclick = ()=>go('payhub');
}
function confirmNum(c){
  const cat = BUY.cats.find(x=>x.id===c.cid)||{};
  $('#app').innerHTML = `${backBtn()}<h2>تأكيد الشراء</h2><div class="card">
    <div class="kv"><span>الدولة</span><b>${esc(c.flag)} ${esc(c.name)} (${esc(c.code)})</b></div>
    <div class="kv"><span>الخدمة</span><b>Telegram</b></div>
    <div class="kv"><span>القسم</span><b>${esc(cat.name||'')}</b></div>
    <div class="kv"><span>السعر</span><b class="price">${money(c.price)}</b></div>
    <div class="kv"><span>رصيدك</span><b>${money(S.balance)}</b></div></div>
   <p class="hint" style="text-align:center">⚠️ بمجرد التأكيد يُخصم المبلغ من محفظتك.</p>
   <button class="btn" id="go">تأكيد الشراء ✅</button>`;
  $('#bk').onclick = drawBuy;
  $('#go').onclick = async (e)=>{
    if (S.balance < c.price) { hap('error'); return insufficient(c.price); }
    e.target.disabled=true; e.target.textContent='جاري الشراء...';
    const r = await api('buy_num',{cid:c.cid,code:c.code});
    if (!r.ok){ hap('error'); if (r.error==='no_balance'){ await refresh(); return insufficient(c.price); } e.target.disabled=false; e.target.textContent='تأكيد الشراء ✅'; return toast(errText(r)); }
    hap('success'); S.balance = r.balance; doneNum(r);
  };
}
function confirmSes(c){
  let qty = 1, rm = false; const max = Math.min(c.stock, 50);
  $('#app').innerHTML = `${backBtn()}<h2>شراء جلسات</h2><div class="card">
    <div class="kv"><span>الدولة</span><b>${esc(c.flag)} ${esc(c.name)} (${esc(c.code)})</b></div>
    <div class="kv"><span>القسم</span><b>${esc(c.cat)}</b></div>
    <div class="kv"><span>سعر الجلسة</span><b class="price">${money(c.price)}</b></div>
    <div class="kv"><span>المتاح</span><b>${c.stock}</b></div>
    <div class="lbl" style="text-align:center;margin-top:12px">العدد المطلوب</div>
    <div class="qty"><button id="mn">−</button><input id="qn" type="number" inputmode="numeric" min="1" max="${max}" value="1" style="width:90px;text-align:center;font-size:24px;margin:0"><button id="pl">+</button></div>
    <div class="lbl" style="text-align:center">التحقق بخطوتين</div>
    <div class="switch"><button class="tab on" id="k0">إبقاء التحقق</button><button class="tab" id="k1">إزالة التحقق</button></div>
    <div class="kv"><span>الإجمالي</span><b class="price" id="tot">${money(c.price)}</b></div>
    <div class="kv"><span>رصيدك</span><b>${money(S.balance)}</b></div></div>
   <p class="hint" style="text-align:center">📦 الجلسات هتوصلك داخل البوت كملف zip.</p>
   <button class="btn" id="go">شراء ✅</button>`;
  const upd = ()=>{ $('#qn').value = qty; $('#tot').textContent = money(c.price*qty); };
  $('#bk').onclick = drawBuy;
  $('#mn').onclick=()=>{ qty=Math.max(1,qty-1); upd(); }; $('#pl').onclick=()=>{ qty=Math.min(max,qty+1); upd(); };
  $('#qn').oninput=(e)=>{ let v=parseInt(e.target.value)||0; if (v>max) v=max; qty=Math.max(1,v||1); if (v>0){ e.target.value=qty; } $('#tot').textContent=money(c.price*qty); };
  $('#k0').onclick=()=>{ rm=false; $('#k0').classList.add('on'); $('#k1').classList.remove('on'); };
  $('#k1').onclick=()=>{ rm=true; $('#k1').classList.add('on'); $('#k0').classList.remove('on'); };
  $('#go').onclick = async ()=>{
    const total = c.price*qty;
    if (S.balance < total) { hap('error'); return insufficient(total); }
    $('#app').innerHTML = `<div class="ok"><div class="spin"></div><h3>جاري تجهيز ${qty} جلسة...</h3><p class="hint">ممكن تاخد دقيقة. متقفلش التطبيق لحد ما يخلص.</p></div>`;
